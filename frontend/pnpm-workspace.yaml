# Single-package workspace so allowBuilds is valid; packages is required by pnpm.
packages:
  - '.'

# Allow known-safe postinstall scripts (esbuild binary, vue-demi switch)
allowBuilds:
  esbuild: true
  vue-demi: true

# pnpm v11 reads overrides here; Docker/CI still use pnpm 9 which also
# honors package.json.pnpm.overrides. Keep both in sync.
overrides:
  js-cookie: 3.0.7
  decode-uri-component@<0.5.1: 0.5.1
  follow-redirects: 1.16.1
  form-data@<4.0.6: '>=4.0.6'
  postcss@<8.5.18: '>=8.5.18'
  dompurify: 3.4.17
  axios@<1.20.0: 1.20.0
  vue: 3.5.44
  '@vue/server-renderer': 3.5.44
  source-map-js@<1.2.2: 1.2.2
